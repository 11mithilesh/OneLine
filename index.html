<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>OneLine Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: studio app — top bar, left tool rail, square stage centred in the workspace with a transport bar beneath.
   Deliberately single-theme: a dark studio shell so every stage look reads against neutral chrome. */
:root {
  --bg: #0c0e13;
  --panel: #13161e;
  --panel-2: #1a1e28;
  --line: #262b37;
  --text: #e8eaf1;
  --muted: #8a91a5;
  --accent: #8f7dff;
  --accent-soft: rgba(143, 125, 255, 0.16);
  --font-brand: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-ui: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-num: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--text); font-family: var(--font-ui); font-size: 13.5px; line-height: 1.4; }
button { font-family: inherit; font-size: inherit; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible, label.btn:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }

.app {
  height: 100%; display: grid;
  grid-template-rows: auto minmax(0, 1fr);
  grid-template-columns: 312px minmax(0, 1fr);
  grid-template-areas: "top top" "side main";
}
.top {
  grid-area: top; display: flex; align-items: center; gap: 14px; justify-content: space-between;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line); background: var(--panel);
}
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-brand); font-weight: 800; font-size: 18px; letter-spacing: -0.01em; }
.brand svg { flex: none; }
.top .actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }

.btn {
  position: relative; display: inline-flex; align-items: center; gap: 7px; cursor: pointer; white-space: nowrap;
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; font-weight: 500;
}
.btn:hover { border-color: #3a4152; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #0e0b24; font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--text); }
.btn input[type=file] { position: absolute; opacity: 0; width: 1px; height: 1px; }
.btn svg { width: 15px; height: 15px; flex: none; }

.side {
  grid-area: side; overflow-y: auto; border-right: 1px solid var(--line); background: var(--panel);
  padding-block: 14px 24px;
  padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: 14px;
  display: grid; gap: 18px; align-content: start;
}
.sec { display: grid; gap: 10px; }
.sec-h { display: flex; justify-content: space-between; align-items: baseline; }
.eyebrow { font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.thumbs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.thumb { display: grid; gap: 4px; min-width: 0; }
.thumb canvas { width: 100%; aspect-ratio: 1; display: block; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); }
.thumb span { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  cursor: pointer; background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; font-size: 12.5px; color: var(--muted);
}
.chip:hover { color: var(--text); border-color: #3a4152; }
.chip[aria-pressed="true"] { color: var(--text); border-color: var(--accent); background: var(--accent-soft); }

.algos { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.algo {
  cursor: pointer; text-align: left; display: grid; gap: 6px; padding: 10px; min-width: 0;
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px;
}
.algo:hover { border-color: #3a4152; }
.algo[aria-pressed="true"] { border-color: var(--accent); background: linear-gradient(var(--accent-soft), var(--accent-soft)), var(--panel-2); }
.algo svg { width: 100%; height: 34px; display: block; }
.algo svg * { fill: none; stroke: var(--muted); stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.algo[aria-pressed="true"] svg * { stroke: var(--accent); }
.algo b { font-weight: 600; font-size: 13px; }
.algo small { color: var(--muted); font-size: 11px; }

.ctl { display: grid; gap: 4px; }
.ctl-h { display: flex; justify-content: space-between; font-size: 12.5px; }
.ctl-h output { font-family: var(--font-num); color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
input[type=range] { width: 100%; accent-color: var(--accent); margin: 0; }
.toggle { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 13px; cursor: pointer; }
.toggle input { accent-color: var(--accent); width: 16px; height: 16px; }

.looks { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.look { cursor: pointer; display: grid; gap: 5px; justify-items: center; background: none; border: 0; padding: 0; color: var(--muted); font-size: 11.5px; }
.look i { display: block; width: 100%; aspect-ratio: 1.3; border-radius: 8px; border: 2px solid var(--line); }
.look[aria-pressed="true"] { color: var(--text); }
.look[aria-pressed="true"] i { border-color: var(--accent); }

.main { grid-area: main; display: grid; grid-template-rows: minmax(0, 1fr) auto; min-width: 0; min-height: 0; }
.stagebox { position: relative; display: grid; place-items: center; padding: 18px; min-height: 0; overflow: hidden; }
.stage { position: relative; border-radius: 12px; overflow: hidden; box-shadow: 0 0 0 1px var(--line), 0 20px 60px rgba(0,0,0,0.45); }
.stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.stage.sketching canvas { cursor: crosshair; }
.hud { position: absolute; left: 10px; top: 10px; right: 10px; display: flex; justify-content: space-between; gap: 8px; pointer-events: none; }
.pill {
  font-family: var(--font-num); font-size: 11.5px; padding: 4px 9px; border-radius: 999px;
  background: rgba(10, 12, 18, 0.72); color: #dfe2ec; border: 1px solid rgba(255,255,255,0.08);
  backdrop-filter: blur(6px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
}
.pill.busy { color: #cfc6ff; border-color: rgba(143,125,255,0.6); }
.pill.warn { color: #ffc7b8; border-color: rgba(255,140,110,0.6); }

.transport {
  border-top: 1px solid var(--line); background: var(--panel);
  padding-block: 10px 12px;
  padding-left: 16px; padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 10px;
}
.trow { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.round {
  width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; flex: none;
  background: var(--accent); border: 0; color: #0e0b24;
}
.round.ghost { background: var(--panel-2); border: 1px solid var(--line); color: var(--text); width: 34px; height: 34px; }
.round svg { width: 16px; height: 16px; }
.timeline { flex: 1 1 240px; min-width: 0; display: flex; align-items: center; gap: 10px; }
.timeline output { font-family: var(--font-num); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.mini { display: grid; gap: 2px; flex: 1 1 180px; min-width: 150px; }
.mini .ctl-h { font-size: 12px; color: var(--muted); }
select {
  background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font-family: var(--font-num); font-size: 12px;
}
.kbd { font-family: var(--font-num); font-size: 10.5px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }

.lab { padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: linear-gradient(180deg, rgba(143,125,255,0.07), transparent 60%); }
.sec-h .tag { font-family: var(--font-num); font-size: 11px; color: var(--muted); }
.sec-h .tag b { color: var(--text); font-weight: 500; }
.vrows { display: grid; gap: 6px; }
.vrow {
  display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 10px; align-items: center; text-align: left; cursor: pointer;
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px 6px 6px;
}
.vrow:hover:not(:disabled) { border-color: #3a4152; }
.vrow[aria-pressed="true"] { border-color: var(--accent); }
.vrow:disabled { cursor: default; }
.vrow:disabled canvas, .vrow:disabled b { opacity: 0.45; }
.vrow canvas { width: 44px; height: 44px; border-radius: 6px; display: block; }
.vrow b { font-weight: 600; font-size: 13px; display: block; }
.vrow small { color: var(--muted); font-size: 11px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vrow .score { font-family: var(--font-num); font-size: 13px; display: grid; gap: 4px; justify-items: end; font-variant-numeric: tabular-nums; }
.vrow .score em { font-style: normal; font-size: 11px; color: #7ee2a8; }
.vrow .score em.neg { color: #ff9b85; }
.meter { width: 56px; height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: var(--accent); }
.labbtns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.labbtns .btn { justify-content: center; }
.spark { display: grid; gap: 4px; }
.spark canvas { width: 100%; height: 46px; display: block; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; }
.spark span { font-family: var(--font-num); font-size: 11.5px; color: var(--muted); min-height: 1.4em; }

body.dragging .stage::after {
  content: "Drop to trace"; position: absolute; inset: 0; display: grid; place-items: center;
  background: rgba(12,14,19,0.78); border: 2px dashed var(--accent); border-radius: 12px;
  font-family: var(--font-brand); font-weight: 800; font-size: 24px; color: var(--accent);
}

@media (max-width: 900px) {
  html, body { height: auto; }
  .app { height: auto; grid-template-columns: minmax(0, 1fr); grid-template-areas: "top" "main" "side"; }
  .side { border-right: 0; border-top: 1px solid var(--line); overflow: visible; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .stagebox { padding: 12px; }
  .transport { padding-left: max(16px, env(safe-area-inset-left, 0px)); }
  .top .label-long { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><circle cx="11" cy="13" r="8" fill="none" stroke="#8f7dff" stroke-width="1.6"/><circle cx="17" cy="9" r="3.6" fill="none" stroke="#8f7dff" stroke-width="1.4" opacity=".7"/><path d="M11 13 L17 9 L19.5 7" stroke="#e8eaf1" stroke-width="1.6" stroke-linecap="round"/><circle cx="19.5" cy="7" r="1.8" fill="#ff8a5c"/></svg>
      OneLine Studio
    </div>
    <div class="actions">
      <label class="btn primary"><input id="file" type="file" accept="image/*">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M8 11V3M4.5 6.5 8 3l3.5 3.5M3 13h10"/></svg>
        Upload<span class="label-long">&nbsp;picture</span></label>
      <button class="btn" id="sketchBtn" aria-pressed="false">

  <aside class="side">

      <div class="sec-h"><span class="eyebrow">Source</span></div>

        <button class="chip" data-s="cat" aria-pressed="false">Cat</button>

        <button class="chip" data-s="type" aria-pressed="false">Lettering</button>
        <button class="chip" data-s="planet" aria-pressed="false">Planet</button>
      </div>
    </section>

    <section class="sec">
      <div class="sec-h"><span class="eyebrow">Line style</span></div>
      <div class="algos" id="algos"></div>

        <button class="vrow" data-v="timing" aria-pressed="false" disabled><canvas></canvas><div><b>Smart timing</b><small>Not run yet</small></div><span class="score">—</span></button>
        <button class="vrow" data-v="fit" aria-pressed="false" disabled><canvas></canvas><div><b>Direct fit</b><small>Not run yet</small></div><span class="score">—</span></button>
      </div>

  <main class="main">

        <div class="mini"><div class="ctl-h"><label for="k">Circles</label><output id="kOut">—</output></div><input id="k" type="range" min="0" max="1000" value="930"></div>
        <div class="mini"><div class="ctl-h"><label for="speed">Duration</label><output id="speedOut">—</output></div><input id="speed" type="range" min="8" max="120" value="45"></div>
        <button class="btn" id="followBtn" aria-pressed="false" title="Camera follows the pen (F)">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="7" cy="7" r="4.2"/><path d="m10.2 10.2 3.3 3.3M7 5v4M5 7h4"/></svg>
          Follow pen</button>
        <button class="btn" id="buildBtn" aria-pressed="false" title="Add circles each lap">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2 13h3V9H2zM6.5 13h3V6h-3zM11 13h3V3h-3z"/></svg>
          Build up</button>
        <select id="nsel" aria-label="Path resolution">
          <option value="4096">4k samples</option>
          <option value="8192" selected>8k samples</option>
          <option value="16384">16k samples</option>
        </select>
      </div>
    </div>
  </main>
</div>
